<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Access Matrix Manager</title>
  <style>
    /* Reset and Global Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-radius: 0 !important; /* Force rectangular shapes */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #FDFBF5; /* Elegant Beige */
      color: #000000;
      min-height: 100vh;
      padding: 0;
    }

    .container {
      display: flex;
      max-width: none;
      margin: 0;
      min-height: 100vh;
      background: none;
      box-shadow: none;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 280px;
      background: #FFFFFF;
      border-right: 1px solid #000;
      padding: 20px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding-bottom: 20px;
      border-bottom: 1px solid #000;
      margin-bottom: 20px;
    }

    .sidebar-header h1 {
      font-size: 1em; /* From sketch logo */
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .sidebar-header h2 {
      font-size: 1.4em;
      font-weight: 400; /* From sketch "Hotel Access Manager" */
    }

    .sidebar-nav .tab {
      display: block;
      width: 100%;
      text-align: left;
      padding: 15px;
      background: none;
      border: 1px solid #000;
      margin-bottom: 10px;
      font-size: 1em;
      cursor: pointer;
      color: #000;
    }

    .sidebar-nav .tab:hover {
      background: #F5F5F5; /* Light gray/beige hover */
    }

    .sidebar-nav .tab.active {
      background: #000;
      color: #FFF;
      border-color: #000;
    }

    /* Main Content Area */
    .content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Department Management */
    .dept-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .dept-card {
      background: #FFFFFF;
      color: #000000;
      padding: 25px;
      cursor: pointer;
      transition: background 0.3s;
      position: relative;
      border: 1px solid #000;
    }

    .dept-card:hover {
      transform: none;
      box-shadow: none;
      background: #F5F5F5;
    }

    .dept-card h3 {
      font-size: 1.3em;
      margin-bottom: 10px;
    }

    .dept-card p {
      opacity: 0.9;
      font-size: 0.9em;
    }

    .dept-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
    }

    .icon-btn {
      background: #FFFFFF;
      border: 1px solid #000;
      color: #000000;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    .icon-btn:hover {
      background: #F5F5F5;
    }

    /* Position Management */
    .position-list {
      display: grid;
      gap: 15px;
      margin-top: 20px;
    }

    .position-item {
      background: #FFFFFF;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid #000;
      position: relative; /* Add this to contain the absolute positioned actions */
    }

    .position-item:hover {
      background: #F5F5F5;
      border-color: #000;
    }

    .position-item.selected {
      background: #EEEEEE;
      border-color: #000;
    }

    .position-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .position-name {
      font-weight: 600;
      font-size: 1.1em;
      color: #000;
    }

    /* Access Matrix */
    .access-section {
      margin-top: 30px;
    }

    .category-block {
      margin-bottom: 30px;
      background: #FFFFFF;
      padding: 20px;
      border: 1px solid #000;
    }

    .category-title {
      font-size: 1.3em;
      font-weight: 700;
      color: #000;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #000;
    }

    .systems-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .system-checkbox {
      display: flex;
      align-items: center;
      background: white;
      padding: 12px 15px;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid #000;
    }

    .system-checkbox:hover {
      border-color: #000;
      box-shadow: none;
      background: #F5F5F5;
    }

    .system-checkbox input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      cursor: pointer;
      accent-color: #000;
      border-radius: 0;
    }

    .system-checkbox label {
      cursor: pointer;
      font-weight: 500;
      color: #000;
      user-select: none;
    }

    /* Systems Management */
    .systems-manager {
      display: grid;
      gap: 20px;
    }

    .category-manager {
      background: #FFFFFF;
      padding: 20px;
      border: 1px solid #000;
    }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .category-name {
      font-size: 1.2em;
      font-weight: 700;
      color: #000;
    }

    .system-list {
      display: grid;
      gap: 10px;
    }

    .system-tag {
      background: white;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #000;
    }

    /* Forms */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #000;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #000;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #000;
    }

    /* Buttons */
    .btn {
      padding: 12px 24px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1em;
      box-shadow: none;
    }

    .btn-primary {
      background: #000000;
      color: white;
      border: 1px solid #000;
    }

    .btn-primary:hover {
      transform: none;
      box-shadow: none;
      background: #333333;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .btn-success {
      background: #28a745;
      color: white;
    }

    .btn-success:hover {
      background: #218838;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      border: 1px solid #000;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      color: #000;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #6c757d;
      line-height: 1;
    }

    .close-btn:hover {
      color: #000;
    }

    /* Breadcrumb */
    .breadcrumb {
      background: #F5F5F5;
      padding: 15px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #6c757d;
      border: 1px solid #EEEEEE;
    }

    .breadcrumb-item {
      cursor: pointer;
      transition: color 0.3s;
    }

    .breadcrumb-item:hover {
      color: #333;
    }

    .breadcrumb-item.active {
      color: #000;
      font-weight: 600;
    }

    /* Action Bar */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .search-box {
      flex: 1;
      max-width: 400px;
      margin-right: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 20px;
      border: 1px solid #000;
      font-size: 1em;
    }

    .search-box input:focus {
      outline: none;
      border-color: #000;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }

    .empty-state h3 {
      font-size: 1.5em;
      margin-bottom: 10px;
    }

    /* Save Indicator */
    .save-indicator {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #000;
      color: white;
      padding: 15px 25px;
      box-shadow: none;
      display: none;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .save-indicator.show {
      display: flex;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        transform: translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- New Sidebar based on sketch -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <img src="../assets/waldorf_logo.png" alt="Waldorf Astoria" style="max-width: 100%; height: auto; margin-bottom: 10px;">
        <h2>Hotel Access Manager</h2>
      </div>
      <div class="sidebar-nav">
        <button class="tab active" onclick="switchTab('departments')">Departments and positions</button>
        <button class="tab" onclick="switchTab('systems')">Systems Managment</button>
      </div>
    </nav>

    <!-- Old .header and .tabs are removed -->

    <main class="content">
      <!-- Departments Tab -->
      <div id="departments" class="tab-content active">
        <div class="breadcrumb" id="breadcrumb">
          <span class="breadcrumb-item active" onclick="showDepartments()">Departments</span>
        </div>

        <div class="action-bar">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search departments or positions..." onkeyup="filterItems()">
          </div>
          <button class="btn btn-primary" onclick="openModal('addDepartment')">+ Add Department</button>
        </div>

        <div id="departmentView"></div>
        <div id="positionView" style="display:none;"></div>
        <div id="accessView" style="display:none;"></div>
      </div>

      <!-- Systems Tab -->
      <div id="systems" class="tab-content">
        <div class="action-bar">
          <h2>System Categories</h2>
          <button class="btn btn-primary" onclick="openModal('addCategory')">+ Add Category</button>
        </div>
        <div id="systemsView"></div>
      </div>
    </main>
  </div>

  <!-- Modals -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Modal</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="save-indicator" id="saveIndicator">
    ✓ Changes saved automatically
  </div>

  <script>
    // Data Structure
    let data = {
      departments: [],
      systems: [],
      categories: [],
      accessMatrix: {}
    };

    let currentDepartment = null;
    let currentPosition = null;

    // Load data from local JSON file
    async function loadData() {
      try {
        const response = await fetch('./data.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        data = await response.json();
        
        // Ensure all required properties exist
        if (!data.departments) data.departments = [];
        if (!data.systems) data.systems = [];
        if (!data.categories) data.categories = [];
        if (!data.accessMatrix) data.accessMatrix = {};
        if (!data.metadata) {
          data.metadata = {
            version: "1.0.0",
            lastModified: new Date().toISOString(),
            description: "Hotel Access Matrix Management Data"
          };
        }
      } catch (error) {
        console.error('Error loading data:', error);
        // Initialize with empty data if file cannot be loaded
        data = {
          metadata: {
            version: "1.0.0",
            lastModified: new Date().toISOString(),
            description: "Hotel Access Matrix Management Data"
          },
          departments: [],
          systems: [],
          categories: [],
          accessMatrix: {}
        };
      }
    }

    // Save data to local JSON file (using download for now)
    async function saveData() {
      try {
        // Update the last modified timestamp
        data.metadata.lastModified = new Date().toISOString();
        
        // In a browser environment, we can't directly write to files
        // For now, we'll just show the save indicator and log the data
        console.log('Data saved:', data);
        showSaveIndicator();
        
        // In a real application, you might want to implement a different
        // saving mechanism like localStorage or a backend API
        localStorage.setItem('waldorf_access_data', JSON.stringify(data));
      } catch (error) {
        console.error('Error saving data:', error);
        alert('Error saving data: ' + error.message);
      }
    }

    function showSaveIndicator() {
      const indicator = document.getElementById('saveIndicator');
      indicator.classList.add('show');
      setTimeout(() => {
        indicator.classList.remove('show');
      }, 2000);
    }

    // Tab Management
    function switchTab(tab) {
      // Use querySelectorAll from the .sidebar-nav context
      document.querySelectorAll('.sidebar-nav .tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      // event.target will be the button clicked
      if (event && event.target) {
        event.target.classList.add('active');
      }
      
      document.getElementById(tab).classList.add('active');
      
      if (tab === 'systems') {
        renderSystemsView();
      } else {
        // When switching back to departments, reset to the top level
        showDepartments();
      }
    }

    // Department View
    function showDepartments() {
      currentDepartment = null;
      currentPosition = null;
      document.getElementById('departmentView').style.display = 'block';
      document.getElementById('positionView').style.display = 'none';
      document.getElementById('accessView').style.display = 'none';
      
      updateBreadcrumb(['Departments']);
      renderDepartments();
    }

    function renderDepartments() {
      const container = document.getElementById('departmentView');
      
      if (data.departments.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No Departments Yet</h3>
            <p>Click "Add Department" to get started</p>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="dept-grid">
          ${data.departments.map(dept => `
            <div class="dept-card" onclick="showPositions(${dept.id})">
              <div class="dept-actions" onclick="event.stopPropagation()">
                <button class="icon-btn" onclick="editDepartment(${dept.id})" title="Edit">✏️</button>
                <button class="icon-btn" onclick="deleteDepartment(${dept.id})" title="Delete">🗑️</button>
              </div>
              <h3>${dept.name}</h3>
              <p>${dept.positions ? dept.positions.length : 0} positions</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Position View
    function showPositions(deptId) {
      currentDepartment = data.departments.find(d => d.id === deptId);
      if (!currentDepartment) return;

      document.getElementById('departmentView').style.display = 'none';
      document.getElementById('positionView').style.display = 'block';
      document.getElementById('accessView').style.display = 'none';

      updateBreadcrumb(['Departments', currentDepartment.name]);
      renderPositions();
    }

    function renderPositions() {
      const container = document.getElementById('positionView');
      const positions = currentDepartment.positions || [];

      container.innerHTML = `
        <div class="action-bar">
          <h2>${currentDepartment.name} - Positions</h2>
          <button class="btn btn-primary" onclick="openModal('addPosition')">+ Add Position</button>
        </div>
        ${positions.length === 0 ? `
          <div class="empty-state">
            <h3>No Positions Yet</h3>
            <p>Click "Add Position" to add a position to this department</p>
          </div>
        ` : `
          <div class="position-list">
            ${positions.map(pos => `
              <div class="position-item" onclick="showAccess(${pos.id})">
                <div class="position-header">
                  <span class="position-name">${pos.name}</span>
                  <div class="dept-actions" onclick="event.stopPropagation()">
                    <button class="icon-btn" onclick="editPosition(${pos.id})" title="Edit">✏️</button>
                    <button class="icon-btn" onclick="deletePosition(${pos.id})" title="Delete">🗑️</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      `;
    }

    // Access Matrix View
    function showAccess(positionId) {
      currentPosition = currentDepartment.positions.find(p => p.id === positionId);
      if (!currentPosition) return;

      document.getElementById('positionView').style.display = 'none';
      document.getElementById('accessView').style.display = 'block';

      updateBreadcrumb(['Departments', currentDepartment.name, currentPosition.name]);
      renderAccessMatrix();
    }

    function renderAccessMatrix() {
      const container = document.getElementById('accessView');
      const positionKey = `${currentDepartment.id}-${currentPosition.id}`;
      const access = data.accessMatrix[positionKey] || {};

      const categorizedSystems = {};
      data.systems.forEach(sys => {
        const category = data.categories.find(c => c.id === sys.categoryId);
        const catName = category ? category.name : 'Uncategorized';
        if (!categorizedSystems[catName]) {
          categorizedSystems[catName] = [];
        }
        categorizedSystems[catName].push(sys);
      });

      container.innerHTML = `
        <div class="action-bar">
          <h2>Access Management - ${currentPosition.name}</h2>
        </div>
        <div class="access-section">
          ${Object.entries(categorizedSystems).map(([catName, systems]) => `
            <div class="category-block">
              <div class="category-title">${catName}</div>
              <div class="systems-grid">
                ${systems.map(sys => `
                  <div class="system-checkbox">
                    <input 
                      type="checkbox" 
                      id="sys-${sys.id}" 
                      ${access[sys.id] ? 'checked' : ''}
                      onchange="toggleAccess(${sys.id})"
                    >
                    <label for="sys-${sys.id}">${sys.name}</label>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function toggleAccess(systemId) {
      const positionKey = `${currentDepartment.id}-${currentPosition.id}`;
      if (!data.accessMatrix[positionKey]) {
        data.accessMatrix[positionKey] = {};
      }
      data.accessMatrix[positionKey][systemId] = !data.accessMatrix[positionKey][systemId];
      await saveData();
    }

    // Systems Management
    function renderSystemsView() {
      const container = document.getElementById('systemsView');
      
      if (data.categories.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No Categories Yet</h3>
            <p>Click "Add Category" to get started</p>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="systems-manager">
          ${data.categories.map(cat => {
            const systems = data.systems.filter(s => s.categoryId === cat.id);
            return `
              <div class="category-manager">
                <div class="category-header">
                  <span class="category-name">${cat.name}</span>
                  <div>
                    <button class="btn btn-success" onclick="openModal('addSystem', ${cat.id})">+ Add System</button>
                    <button class="icon-btn" onclick="editCategory(${cat.id})">✏️</button>
                    <button class="icon-btn" onclick="deleteCategory(${cat.id})">🗑️</button>
                  </div>
                </div>
                ${systems.length === 0 ? '<p style="color:#6c757d;">No systems in this category</p>' : `
                  <div class="system-list">
                    ${systems.map(sys => `
                      <div class="system-tag">
                        <span>${sys.name}</span>
                        <div>
                          <button class="icon-btn" onclick="editSystem(${sys.id})">✏️</button>
                          <button class="icon-btn" onclick="deleteSystem(${sys.id})">🗑️</button>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // Modal Management
    function openModal(type, data) {
      const modal = document.getElementById('modal');
      const title = document.getElementById('modalTitle');
      const body = document.getElementById('modalBody');

      switch(type) {
        case 'addDepartment':
          title.textContent = 'Add Department';
          body.innerHTML = `
            <div class="form-group">
              <label>Department Name</label>
              <input type="text" id="deptName" placeholder="Enter department name">
            </div>
            <button class="btn btn-primary" onclick="addDepartment()">Add Department</button>
          `;
          break;

        case 'editDepartment':
          const dept = data;
          title.textContent = 'Edit Department';
          body.innerHTML = `
            <div class="form-group">
              <label>Department Name</label>
              <input type="text" id="deptName" value="${dept.name}">
            </div>
            <button class="btn btn-primary" onclick="updateDepartment(${dept.id})">Update Department</button>
          `;
          break;

        case 'addPosition':
          title.textContent = 'Add Position';
          body.innerHTML = `
            <div class="form-group">
              <label>Position Name</label>
              <input type="text" id="posName" placeholder="Enter position name">
            </div>
            <button class="btn btn-primary" onclick="addPosition()">Add Position</button>
          `;
          break;

        case 'editPosition':
          const pos = data;
          title.textContent = 'Edit Position';
          body.innerHTML = `
            <div class="form-group">
              <label>Position Name</label>
              <input type="text" id="posName" value="${pos.name}">
            </div>
            <button class="btn btn-primary" onclick="updatePosition(${pos.id})">Update Position</button>
          `;
          break;

        case 'addCategory':
          title.textContent = 'Add Category';
          body.innerHTML = `
            <div class="form-group">
              <label>Category Name</label>
              <input type="text" id="catName" placeholder="Enter category name">
            </div>
            <button class="btn btn-primary" onclick="addCategory()">Add Category</button>
          `;
          break;

        case 'editCategory':
          const cat = data;
          title.textContent = 'Edit Category';
          body.innerHTML = `
            <div class="form-group">
              <label>Category Name</label>
              <input type="text" id="catName" value="${cat.name}">
            </div>
            <button class="btn btn-primary" onclick="updateCategory(${cat.id})">Update Category</button>
          `;
          break;

        case 'addSystem':
          title.textContent = 'Add System';
          body.innerHTML = `
            <div class="form-group">
              <label>System Name</label>
              <input type="text" id="sysName" placeholder="Enter system name">
            </div>
            <div class="form-group">
              <label>Category</label>
              <select id="sysCat">
                ${window.data.categories.map(c => `
                  <option value="${c.id}" ${c.id === data ? 'selected' : ''}>${c.name}</option>
                `).join('')}
              </select>
            </div>
            <button class="btn btn-primary" onclick="addSystem()">Add System</button>
          `;
          break;

        case 'editSystem':
          const sys = data;
          title.textContent = 'Edit System';
          body.innerHTML = `
            <div class="form-group">
              <label>System Name</label>
              <input type="text" id="sysName" value="${sys.name}">
            </div>
            <div class="form-group">
              <label>Category</label>
              <select id="sysCat">
                ${window.data.categories.map(c => `
                  <option value="${c.id}" ${c.id === sys.categoryId ? 'selected' : ''}>${c.name}</option>
                `).join('')}
              </select>
            </div>
            <button class="btn btn-primary" onclick="updateSystem(${sys.id})">Update System</button>
          `;
          break;
      }

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    // CRUD Operations - Departments
    async function addDepartment() {
      const name = document.getElementById('deptName').value.trim();
      if (!name) {
          console.log('Department name is required');
          return; 
      }

      const newDept = {
        id: Date.now(),
        name: name,
        positions: []
      };

      data.departments.push(newDept);
      await saveData();
      closeModal();
      renderDepartments();
    }

    async function editDepartment(id) {
      const dept = data.departments.find(d => d.id === id);
      if (!dept) return;
      openModal('editDepartment', dept);
    }

    async function updateDepartment(id) {
      const name = document.getElementById('deptName').value.trim();
      if (!name) {
          console.log('Department name is required');
          return;
      }

      const dept = data.departments.find(d => d.id === id);
      if (dept) {
        dept.name = name;
        await saveData();
        closeModal();
        renderDepartments();
        if (currentDepartment && currentDepartment.id === id) {
          currentDepartment.name = name;
          updateBreadcrumb(['Departments', name]);
        }
      }
    }

    async function deleteDepartment(id) {
      const dept = data.departments.find(d => d.id === id);
      if (!dept) return;
      
      const confirmed = confirm(
        `Are you sure you want to delete the department "${dept.name}"? This will also delete all positions in this department and their access permissions.`
      );
      
      if (!confirmed) return;
      
      data.departments = data.departments.filter(d => d.id !== id);
      
      // Clean up access matrix
      Object.keys(data.accessMatrix).forEach(key => {
        if (key.startsWith(`${id}-`)) {
          delete data.accessMatrix[key];
        }
      });
      
      await saveData();
      renderDepartments();
    }

    // CRUD Operations - Positions
    async function addPosition() {
      const name = document.getElementById('posName').value.trim();
      if (!name) {
          console.log('Position name is required');
          return;
      }

      if (!currentDepartment.positions) {
        currentDepartment.positions = [];
      }

      const newPos = {
        id: Date.now(),
        name: name
      };

      currentDepartment.positions.push(newPos);
      await saveData();
      closeModal();
      renderPositions();
    }

    async function editPosition(id) {
      const pos = currentDepartment.positions.find(p => p.id === id);
      if (!pos) return;
      openModal('editPosition', pos);
    }

    async function updatePosition(id) {
      const name = document.getElementById('posName').value.trim();
      if (!name) {
          console.log('Position name is required');
          return;
      }

      const pos = currentDepartment.positions.find(p => p.id === id);
      if (pos) {
        pos.name = name;
        await saveData();
        closeModal();
        renderPositions();
      }
    }

    async function deletePosition(id) {
      const pos = currentDepartment.positions.find(p => p.id === id);
      if (!pos) return;
      
      const confirmed = confirm(
        `Are you sure you want to delete the position "${pos.name}"? This will also delete all access permissions for this position.`
      );
      
      if (!confirmed) return;
      
      currentDepartment.positions = currentDepartment.positions.filter(p => p.id !== id);
      
      // Clean up access matrix
      const positionKey = `${currentDepartment.id}-${id}`;
      delete data.accessMatrix[positionKey];
      
      await saveData();
      renderPositions();
    }

    // CRUD Operations - Categories
    async function addCategory() {
      const name = document.getElementById('catName').value.trim();
      if (!name) {
          console.log('Category name is required');
          return;
      }

      const newCat = {
        id: Date.now(),
        name: name
      };

      data.categories.push(newCat);
      await saveData();
      closeModal();
      renderSystemsView();
    }

async function editCategory(id) {
      const cat = data.categories.find(c => c.id === id);
      if (!cat) return;
      openModal('editCategory', cat);
    }

    async function updateCategory(id) {
      const name = document.getElementById('catName').value.trim();
      if (!name) {
          console.log('Category name is required');
          return;
      }

      const cat = data.categories.find(c => c.id === id);
      if (cat) {
        cat.name = name;
        await saveData();
        closeModal();
        renderSystemsView();
      }
    }

    async function deleteCategory(id) {
      const systems = data.systems.filter(s => s.categoryId === id);
      if (systems.length > 0) {
        alert(
          'Cannot delete category with systems. Please delete or reassign all systems first.'
        );
        return;
      }
      
      const cat = data.categories.find(c => c.id === id);
      if (!cat) return;
      
      const confirmed = confirm(
        `Are you sure you want to delete the category "${cat.name}"?`
      );
      
      if (!confirmed) return;
      
      data.categories = data.categories.filter(c => c.id !== id);
      await saveData();
      renderSystemsView();
    }

    // CRUD Operations - Systems
    async function addSystem() {
      const name = document.getElementById('sysName').value.trim();
      const categoryId = parseInt(document.getElementById('sysCat').value);
      
      if (!name) {
          console.log('System name is required');
          return;
      }

      const newSys = {
        id: Date.now(),
        name: name,
        categoryId: categoryId
      };

      data.systems.push(newSys);
      await saveData();
      closeModal();
      renderSystemsView();
    }

    async function editSystem(id) {
      const sys = data.systems.find(s => s.id === id);
      if (!sys) return;
      openModal('editSystem', sys);
    }

    async function updateSystem(id) {
      const name = document.getElementById('sysName').value.trim();
      const categoryId = parseInt(document.getElementById('sysCat').value);
      
      if (!name) {
          console.log('System name is required');
          return;
      }

      const sys = data.systems.find(s => s.id === id);
      if (sys) {
        sys.name = name;
        sys.categoryId = categoryId;
        await saveData();
        closeModal();
        renderSystemsView();
      }
    }

    async function deleteSystem(id) {
      const sys = data.systems.find(s => s.id === id);
      if (!sys) return;
      
      const confirmed = confirm(
        `Are you sure you want to delete the system "${sys.name}"? This will also remove access to this system for all positions.`
      );
      
      if (!confirmed) return;
      
      data.systems = data.systems.filter(s => s.id !== id);
      
      // Clean up access matrix
      Object.keys(data.accessMatrix).forEach(key => {
        if (data.accessMatrix[key][id]) {
          delete data.accessMatrix[key][id];
        }
      });
      
      await saveData();
      renderSystemsView();
    }

    // Breadcrumb
    function updateBreadcrumb(items) {
      const breadcrumb = document.getElementById('breadcrumb');
      breadcrumb.innerHTML = items.map((item, index) => {
        const isLast = index === items.length - 1;
        const isFirst = index === 0;
        return `
          ${index > 0 ? '<span style="color: #6c757d; margin: 0 5px;">/</span>' : ''}
          <span class="breadcrumb-item ${isLast ? 'active' : ''}" 
                onclick="${isFirst ? 'showDepartments()' : index === 1 ? `showPositions(${currentDepartment.id})` : ''}">
            ${item}
          </span>
        `;
      }).join('');
    }

    // Search/Filter
    function filterItems() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      if (document.getElementById('departmentView').style.display !== 'none') {
        const cards = document.querySelectorAll('.dept-card');
        cards.forEach(card => {
          const text = card.textContent.toLowerCase();
          card.style.display = text.includes(query) ? 'block' : 'none';
        });
      } else if (document.getElementById('positionView').style.display !== 'none') {
        const items = document.querySelectorAll('.position-item');
        items.forEach(item => {
          const text = item.textContent.toLowerCase();
          item.style.display = text.includes(query) ? 'block' : 'none';
        });
      }
    }

    // Close modal on outside click
    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });

    // Make data globally accessible for modal functions
    window.data = data;

    // Initialize on load
    document.addEventListener('DOMContentLoaded', async () => {
      await loadData();
      renderDepartments();
    });
  </script>
</body>
</html>
